name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: this repo is small and a stale run is
# never useful.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fails CI on warnings anywhere, which is what makes the lint table in
  # Cargo.toml load-bearing rather than decorative.
  RUSTFLAGS: -D warnings

jobs:
  site:
    name: shared documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny
        run: cargo deny check
      - name: no NVIDIA crates by crates.io name
        run: |
          set -o pipefail
          if grep -rn --include=Cargo.toml --include='Cargo.lock' \
              -E '^\s*(cuda-oxide|cutile-rs|cudarc)\s*=' .; then
            echo "::error::a NVIDIA crate was added by a crates.io name. \
              cuda-oxide on crates.io is an unrelated GPL-3.0 squatter; NVIDIA's is \
              NVIDIA/cuda-rust on git. cutile-rs is a repository name, not a crate. \
              See ADR-0009 and ADR-0010."
            exit 1
          fi
          echo "no crates.io-name NVIDIA dependency"
      - name: the default feature set carries no GPU backend
        run: |
          set -o pipefail
          # ADR-0008: CubeCL is default-off, so the portable GPU path must not
          # appear in a default build. A dependency that is default-on defeats the
          # point of the decision even though the decision is still "recorded".
          if cargo tree --workspace --depth 1 | grep -E 'cubecl|wgpu|cuda|cutile'; then
            echo "::error::a GPU backend reached the default feature set. \
              CubeCL must stay behind a default-off feature; see ADR-0008."
            exit 1
          fi
          echo "the default build carries no GPU backend"
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show
        run: rustup show active-toolchain
      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --workspace --all-features --locked

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features --locked

  # The crate declares rust-version 1.97 and pins an exact channel in
  # rust-toolchain.toml. This job checks the *minimum* declared version still
  # builds, which is a different promise from "the pinned version builds".
  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features --locked

  # The gates that need a vendor toolchain, in a job where the toolchain is
  # *required* rather than looked for.
  #
  # Every other job runs with neither `verilator` nor `iverilog` installed, so both
  # print their skip and the suite is green either way. That is the right default --
  # a hard dependency on a vendor tool would make the suite unrunnable -- but it
  # means the ordinary `test` job does not check the one thing a hardware DSL is
  # mostly wrong about: whether the Verilog it emits behaves like the design.
  #
  # So this job installs both, and then asserts that *nothing skipped*. The grep is
  # the point. Without it the job would pass on a runner where the install silently
  # failed and every equivalence test took its skip path -- green, and meaningless.
  cosim:
    name: cosim (verilator + iverilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install verilator and iverilog
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y verilator iverilog
      - name: tool versions
        run: |
          verilator --version
          iverilog -V | head -1
      - name: random-design equivalence
        run: |
          set -o pipefail
          cargo test -p ferrite-lithic-cosim --test equivalence --all-features --locked \
            -- --nocapture 2>&1 | tee /tmp/equivalence.txt
      - name: corpus equivalence
        run: |
          set -o pipefail
          cargo test -p ferrite-lithic-corpus --all-features --locked -- --nocapture 2>&1 \
            | tee /tmp/corpus.txt
      - name: the iCarus syntax gate
        run: |
          set -o pipefail
          cargo test -p ferrite-lithic-rtl --test iverilog --all-features --locked \
            -- --nocapture 2>&1 | tee /tmp/iverilog.txt
      - name: nothing may have skipped
        run: |
          if grep -q SKIPPED /tmp/equivalence.txt /tmp/corpus.txt /tmp/iverilog.txt; then
            echo "::error::a testbench-gated test skipped, so this job proved nothing"
            grep -n SKIPPED /tmp/equivalence.txt /tmp/corpus.txt /tmp/iverilog.txt
            exit 1
          fi
          echo "every gated test ran"

  # The synthesis gate.
  #
  # A hardware DSL is judged on the Verilog it emits, and a Verilog file that
  # has never been through a synthesiser is a file whose *size* nobody has
  # measured. The node counts in the graph are not gate counts — an `add` is one
  # node and forty gates — so the area question needs the tool that answers it.
  #
  # The job asserts that nothing skipped, for the same reason the cosim job
  # does: a synthesis run that did not happen proves nothing, and says so in
  # its output.
  synth:
    name: synth (yosys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install yosys
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y yosys
      - name: tool version
        run: yosys -V
      - name: synthesise every corpus design
        run: |
          set -o pipefail
          cargo test -p ferrite-lithic-corpus --test synthesis --all-features --locked \
            -- --ignored --nocapture 2>&1 | tee /tmp/synthesis.txt
      - name: nothing may have skipped
        run: |
          if grep -q SKIPPED /tmp/synthesis.txt; then
            echo "::error::the synthesis gate skipped, so this job proved nothing"
            grep -n SKIPPED /tmp/synthesis.txt
            exit 1
          fi
          echo "every design was synthesised"

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
